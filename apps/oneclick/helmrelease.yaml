apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oneclick
  namespace: default
spec:
  interval: 1m
  timeout: 10m
  chart:
    spec:
      chart: ./helm/oneclick
      sourceRef:
        kind: GitRepository
        name: oneclick
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
      remediateLastFailure: true
  values:
    frontend:
      image:
        repository: ghcr.io/vaishjp/frontend
        tag: "9ae6cb0-2"
      replicas: 2
      service:
        type: ClusterIP
        port: 80
        targetPort: 3000
    backend:
      image:
        repository: ghcr.io/vaishjp/backend
        tag: "9ae6cb0-2"
      replicas: 2
      service:
        type: ClusterIP
        port: 4000
    database:
      host: postgres
      user: postgres